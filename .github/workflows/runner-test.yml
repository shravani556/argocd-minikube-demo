name: Vault Nexus Login Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: self-hosted

    permissions:
      contents: read
      id-token: write

    steps:

      # =========================================================
      # 1. Authenticate GitHub Actions to Vault using OIDC
      # =========================================================
      - name: Authenticate to Vault and get Nexus credentials
        uses: hashicorp/vault-action@v4
        with:
          method: jwt
          url: http://127.0.0.1:8201
          role: github-html-ci
          jwtGithubAudience: https://github.com/shravani556

          secrets: |
            secret/data/ci/nexus username | NEXUS_USERNAME ;
            secret/data/ci/nexus password | NEXUS_PASSWORD

      # =========================================================
      # 2. Verify Vault returned credentials
      # =========================================================
      - name: Verify Vault credentials
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "VAULT CHECK"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:NEXUS_USERNAME)) {
            throw "NEXUS_USERNAME is empty"
          }

          if ([string]::IsNullOrWhiteSpace($env:NEXUS_PASSWORD)) {
            throw "NEXUS_PASSWORD is empty"
          }

          Write-Host "Username received: [$env:NEXUS_USERNAME]"
          Write-Host "Password length: $($env:NEXUS_PASSWORD.Length)"
          Write-Host "Vault credentials retrieved successfully"

      # =========================================================
      # 3. Identify the Windows account running the runner
      # =========================================================
      - name: Check runner identity
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "RUNNER IDENTITY"
          Write-Host "======================================"

          Write-Host "whoami:"
          whoami

          Write-Host ""
          Write-Host "COMPUTERNAME:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "USERNAME:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "USERPROFILE:"
          Write-Host $env:USERPROFILE

      # =========================================================
      # 4. Check Docker environment
      # =========================================================
      - name: Check Docker environment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "DOCKER ENVIRONMENT"
          Write-Host "======================================"

          Write-Host "Docker context:"
          docker context show

          Write-Host ""
          Write-Host "Docker version:"
          docker version

          Write-Host ""
          Write-Host "DOCKER_HOST:"
          if ($env:DOCKER_HOST) {
            Write-Host $env:DOCKER_HOST
          }
          else {
            Write-Host "DOCKER_HOST is not set"
          }

          Write-Host ""
          Write-Host "DOCKER_CONFIG:"
          if ($env:DOCKER_CONFIG) {
            Write-Host $env:DOCKER_CONFIG
          }
          else {
            Write-Host "DOCKER_CONFIG is not set"
          }

      # =========================================================
      # 5. Check Nexus TCP connectivity
      # =========================================================
      - name: Check Nexus TCP connectivity
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "NEXUS CONNECTIVITY"
          Write-Host "======================================"

          $result = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 8081 `
            -WarningAction SilentlyContinue

          Write-Host "ComputerName: $($result.ComputerName)"
          Write-Host "RemotePort: $($result.RemotePort)"
          Write-Host "TcpTestSucceeded: $($result.TcpTestSucceeded)"

          if (-not $result.TcpTestSucceeded) {
            throw "Cannot connect to Nexus on 127.0.0.1:8081"
          }

      # =========================================================
      # 6. Check Nexus Docker endpoint
      # =========================================================
      - name: Check Nexus Docker endpoint
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "NEXUS DOCKER ENDPOINT"
          Write-Host "======================================"

          try {
            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8081/v2/" `
              -UseBasicParsing `
              -ErrorAction Stop

            Write-Host "HTTP status: $($response.StatusCode)"
            Write-Host "Nexus Docker endpoint responded successfully"
          }
          catch {
            Write-Host "Nexus endpoint response:"
            Write-Host $_.Exception.Message

            if ($_.Exception.Response) {
              Write-Host ""
              Write-Host "HTTP status:"
              Write-Host ([int]$_.Exception.Response.StatusCode)
            }

            Write-Host ""
            Write-Host "A 401/403 response from /v2/ can be normal before authentication."
          }

      # =========================================================
      # 7. Check password formatting without exposing it
      # =========================================================
      - name: Check credential formatting
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "CREDENTIAL FORMAT CHECK"
          Write-Host "======================================"

          $passwordLength = $env:NEXUS_PASSWORD.Length
          $trimmedLength = $env:NEXUS_PASSWORD.Trim().Length

          Write-Host "Username length: $($env:NEXUS_USERNAME.Length)"
          Write-Host "Password length: $passwordLength"
          Write-Host "Trimmed password length: $trimmedLength"

          if ($passwordLength -ne $trimmedLength) {
            Write-Host "WARNING: password contains leading or trailing whitespace"
          }
          else {
            Write-Host "No leading/trailing password whitespace detected"
          }

      # =========================================================
      # 8. TEST NEXUS LOGIN
      #
      # Instead of PowerShell piping directly into docker.exe,
      # write the password to a temporary file and use cmd.exe
      # stdin redirection.
      # =========================================================
      - name: Test Nexus Docker login
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "DOCKER LOGIN TEST"
          Write-Host "======================================"

          $passwordFile = Join-Path $env:RUNNER_TEMP "nexus-password.txt"

          try {

            # Write password without adding a newline.
            [System.IO.File]::WriteAllText(
              $passwordFile,
              $env:NEXUS_PASSWORD
            )

            Write-Host "Registry: 127.0.0.1:8081"
            Write-Host "Username: [$env:NEXUS_USERNAME]"
            Write-Host "Password length: $($env:NEXUS_PASSWORD.Length)"

            # Use cmd.exe so stdin is redirected directly to docker.exe.
            $username = $env:NEXUS_USERNAME

            cmd.exe /c "docker login 127.0.0.1:8081 --username `"$username`" --password-stdin < `"$passwordFile`""

            if ($LASTEXITCODE -ne 0) {
              throw "Docker login to Nexus failed"
            }

            Write-Host ""
            Write-Host "Docker login to Nexus succeeded."

          }
          finally {

            if (Test-Path $passwordFile) {
              Remove-Item $passwordFile -Force
            }

          }

      # =========================================================
      # 9. Final result
      # =========================================================
      - name: Final verification
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "FINAL RESULT"
          Write-Host "======================================"

          Write-Host "Docker context:"
          docker context show

          Write-Host ""
          Write-Host "Docker server:"
          docker version --format "Server={{.Server.Version}}"

          Write-Host ""
          Write-Host "SUCCESS: GitHub Actions authenticated to Nexus."