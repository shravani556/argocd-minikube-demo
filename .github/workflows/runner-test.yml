name: Vault Authentication Test

on:
  workflow_dispatch:

jobs:
  test-vault:
    runs-on: self-hosted

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Vault and read Nexus credentials
        uses: hashicorp/vault-action@v3
        with:
          method: jwt
          url: http://127.0.0.1:8201
          role: github-html-ci
          secrets: |
            secret/data/ci/nexus username | NEXUS_USERNAME ;
            secret/data/ci/nexus password | NEXUS_PASSWORD

      - name: Verify Vault authentication
        shell: powershell
        run: |
          Write-Host "Vault authentication successful"
          Write-Host "Nexus username received: $env:NEXUS_USERNAME"

          if ([string]::IsNullOrWhiteSpace($env:NEXUS_PASSWORD)) {
            throw "Nexus password was not retrieved"
          }

          Write-Host "Nexus password was retrieved successfully"