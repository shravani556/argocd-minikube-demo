name: HTML App CI

on:
  push:
    branches:
      - main
    paths:
      - "html-app/**"

  workflow_dispatch:

jobs:
  build-push-update:
    runs-on: self-hosted

    permissions:
      contents: write
      id-token: write

    env:
      # Nexus address used by Docker on the Windows runner
      NEXUS_PUSH_HOST: localhost:8081

      # Nexus address reachable from Minikube
      NEXUS_IMAGE_HOST: 192.168.49.1:8081

      # Nexus hosted repository
      NEXUS_REPOSITORY: docker-hosted

      # Docker image name
      IMAGE_NAME: html-gitops

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================================================
      # 2. Generate immutable image version
      # =========================================================
      - name: Generate image version
        shell: powershell
        run: |
          $version = "1.0.${{ github.run_number }}"

          "IMAGE_VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "======================================"
          Write-Host "IMAGE VERSION"
          Write-Host "======================================"
          Write-Host $version

      # =========================================================
      # 3. Authenticate GitHub Actions to Vault using OIDC
      # =========================================================
      - name: Get Nexus credentials from Vault
        uses: hashicorp/vault-action@v4
        with:
          method: jwt
          url: http://127.0.0.1:8201
          role: github-html-ci
          jwtGithubAudience: https://github.com/shravani556

          secrets: |
            secret/data/ci/nexus username | NEXUS_USERNAME ;
            secret/data/ci/nexus password | NEXUS_PASSWORD

      # =========================================================
      # 4. Verify Vault secrets
      # =========================================================
      - name: Verify Vault secrets
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "VAULT CHECK"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:NEXUS_USERNAME)) {
            throw "NEXUS_USERNAME was not retrieved from Vault"
          }

          if ([string]::IsNullOrWhiteSpace($env:NEXUS_PASSWORD)) {
            throw "NEXUS_PASSWORD was not retrieved from Vault"
          }

          Write-Host "Vault authentication successful"
          Write-Host "Nexus username retrieved: $env:NEXUS_USERNAME"
          Write-Host "Nexus password retrieved successfully"
          Write-Host "Password length: $($env:NEXUS_PASSWORD.Length)"

      # =========================================================
      # 5. Login to Nexus
      #
      # Important:
      # PowerShell -> docker.exe stdin caused problems earlier.
      # We therefore use a temporary file + cmd.exe redirection.
      # =========================================================
      - name: Login to Nexus
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "NEXUS LOGIN"
          Write-Host "======================================"

          $passwordFile = Join-Path $env:RUNNER_TEMP "nexus-password.txt"

          try {

            [System.IO.File]::WriteAllText(
              $passwordFile,
              $env:NEXUS_PASSWORD
            )

            $username = $env:NEXUS_USERNAME

            cmd.exe /c "docker login $env:NEXUS_PUSH_HOST --username `"$username`" --password-stdin < `"$passwordFile`""

            if ($LASTEXITCODE -ne 0) {
              throw "Docker login to Nexus failed"
            }

            Write-Host "Docker login to Nexus succeeded."

          }
          finally {

            if (Test-Path $passwordFile) {
              Remove-Item $passwordFile -Force
            }

          }

      # =========================================================
      # 6. Build Docker image
      # =========================================================
      - name: Build Docker image
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "DOCKER BUILD"
          Write-Host "======================================"

          $image = "$env:NEXUS_PUSH_HOST/$env:NEXUS_REPOSITORY/$env:IMAGE_NAME`:$env:IMAGE_VERSION"

          Write-Host "Building:"
          Write-Host $image

          docker build `
            -t $image `
            .\html-app

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed"
          }

          Write-Host "Docker build succeeded."

      # =========================================================
      # 7. Push image to Nexus
      # =========================================================
      - name: Push Docker image
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "NEXUS PUSH"
          Write-Host "======================================"

          $image = "$env:NEXUS_PUSH_HOST/$env:NEXUS_REPOSITORY/$env:IMAGE_NAME`:$env:IMAGE_VERSION"

          Write-Host "Pushing:"
          Write-Host $image

          docker push $image

          if ($LASTEXITCODE -ne 0) {
            throw "Docker push failed"
          }

          Write-Host "Docker image pushed successfully."

      # =========================================================
      # 8. Update Kubernetes deployment.yaml
      #
      # IMPORTANT:
      # Kubernetes/Minikube must use the address reachable
      # from Minikube, not localhost.
      # =========================================================
      - name: Update Kubernetes image
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "UPDATE KUBERNETES MANIFEST"
          Write-Host "======================================"

          $file = "html/deployment.yaml"

          if (-not (Test-Path $file)) {
            throw "$file was not found"
          }

          $content = Get-Content $file -Raw

          $newImage = "$env:NEXUS_IMAGE_HOST/$env:NEXUS_REPOSITORY/$env:IMAGE_NAME`:$env:IMAGE_VERSION"

          Write-Host "New Kubernetes image:"
          Write-Host $newImage

          $updated = $content -replace `
            'image:\s*.*html-gitops:[^\s]+', `
            "image: $newImage"

          if ($updated -eq $content) {
            throw "Could not find existing html-gitops image in deployment.yaml"
          }

          Set-Content `
            -Path $file `
            -Value $updated `
            -Encoding utf8

          Write-Host ""
          Write-Host "Updated deployment.yaml:"
          Get-Content $file

      # =========================================================
      # 9. Commit deployment manifest
      # =========================================================
      - name: Commit deployment update
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "GIT COMMIT"
          Write-Host "======================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add html/deployment.yaml

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No deployment change detected."
            exit 0
          }

          git commit `
            -m "Update html-app image to $env:IMAGE_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "Git commit failed"
          }

      # =========================================================
      # 10. Push updated manifest to GitHub
      # =========================================================
      - name: Push deployment update
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "GIT PUSH"
          Write-Host "======================================"

          git push origin HEAD:main

          if ($LASTEXITCODE -ne 0) {
            throw "Git push failed"
          }

          Write-Host "Deployment manifest pushed to GitHub."

      # =========================================================
      # 11. Final summary
      # =========================================================
      - name: CI summary
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "HTML CI COMPLETED"
          Write-Host "======================================"

          Write-Host "Image pushed to Nexus:"
          Write-Host "$env:NEXUS_PUSH_HOST/$env:NEXUS_REPOSITORY/$env:IMAGE_NAME`:$env:IMAGE_VERSION"

          Write-Host ""
          Write-Host "Kubernetes image reference:"
          Write-Host "$env:NEXUS_IMAGE_HOST/$env:NEXUS_REPOSITORY/$env:IMAGE_NAME`:$env:IMAGE_VERSION"

          Write-Host ""
          Write-Host "Git manifest:"
          Write-Host "html/deployment.yaml"

          Write-Host ""
          Write-Host "Argo CD automatic sync should now reconcile the Git change."